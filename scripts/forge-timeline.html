<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge Trace — Match Timeline</title>
<style>
  :root {
    --ink: #0B0A12;
    --panel: #171326;
    --panel2: #14111F;
    --border: #2A203B;
    --cream: #F0E7D2;
    --muted: #9CA6A5;
    --sand: #D6B98A;
    --ochre: #D09A4E;
    --amber: #EAB54C;
    --red: #B84B45;
    --sky: #7FB4C9;
    --mono: ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--ink); color: var(--cream);
    font: 12px/1.4 var(--mono);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  button, input, select { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--border); }
  button { cursor: pointer; padding: 3px 8px; border-radius: 3px; }
  button:hover { border-color: var(--ochre); }
  button:focus-visible, input:focus-visible, label:focus-within { outline: 2px solid var(--ochre); outline-offset: 1px; }
  .mono { font-family: var(--mono); }
  .dim { color: var(--muted); }

  /* ---------- toolbar ---------- */
  #toolbar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 6px 10px; border-bottom: 1px solid var(--border);
    background: var(--panel); flex: 0 0 auto;
  }
  #toolbar .sep { width: 1px; height: 18px; background: var(--border); margin: 0 2px; }
  #zoom-pct { min-width: 48px; text-align: right; color: var(--sand); }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border: 1px solid var(--border); border-radius: 3px; cursor: pointer; user-select: none; }
  .chip input { margin: 0; }
  .chip[data-team="A"] { color: var(--ochre); }
  .chip[data-team="B"] { color: var(--sky); }
  .chip[data-team="S"] { color: var(--muted); }
  .chip.off { opacity: .35; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
  #milestone-toggle { color: var(--amber); }
  #milestone-toggle.on { border-color: var(--amber); background: #2A2133; }
  #search { width: 170px; padding: 3px 6px; border-radius: 3px; }
  #search.active { border-color: var(--amber); }
  #fail-badge { color: var(--red); min-width: 34px; text-align: center; }
  #fail-status { color: var(--muted); }
  details#type-filter { position: relative; }
  details#type-filter summary { cursor: pointer; padding: 3px 8px; border: 1px solid var(--border); border-radius: 3px; list-style: none; }
  details#type-filter summary::-webkit-details-marker { display: none; }
  #type-list {
    position: absolute; top: 26px; left: 0; z-index: 40;
    background: var(--panel); border: 1px solid var(--border);
    padding: 6px; max-height: 320px; overflow-y: auto; width: 260px;
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
  }
  #type-list label { display: block; padding: 1px 2px; cursor: pointer; white-space: nowrap; }
  #type-list label:hover { background: #221C33; }
  #type-list .row-all { margin-bottom: 4px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }

  /* ---------- banners ---------- */
  #banners { padding: 0 10px; background: #1C1626; border-bottom: 1px solid var(--border); flex: 0 0 auto; display: none; }
  #banners.show { display: block; }
  .banner { color: var(--ochre); font-size: 11px; padding: 3px 0; }
  .banner::before { content: "▲ "; }

  /* ---------- layout ---------- */
  #layout { flex: 1 1 auto; display: flex; min-height: 0; position: relative; }
  #plot-wrap { flex: 1 1 auto; position: relative; overflow-y: auto; overflow-x: hidden; min-width: 0; }
  #gutter { position: absolute; left: 0; top: 0; width: 190px; z-index: 2; }
  #gutter .grow {
    position: absolute; left: 0; width: 100%;
    display: flex; align-items: center; gap: 4px;
    padding: 0 6px; overflow: hidden; white-space: nowrap;
    border-bottom: 1px solid rgba(42,32,59,.5);
  }
  #gutter .grow.team { text-transform: uppercase; letter-spacing: .18em; font-size: 11px; color: var(--ochre); background: #1A1426; cursor: pointer; }
  #gutter .grow.team[data-team="B"] { color: var(--sky); }
  #gutter .grow.team[data-team="S"] { color: var(--muted); }
  #gutter .grow.block { text-transform: uppercase; letter-spacing: .16em; font-size: 10px; color: var(--muted); background: #141020; cursor: pointer; }
  #gutter .grow.track { font-size: 11px; color: var(--cream); background: transparent; }
  #gutter .grow .chev { color: var(--muted); width: 10px; flex: 0 0 10px; }
  #gutter .grow .note { margin-left: auto; color: var(--muted); font-size: 10px; flex: 0 0 auto; }
  #gutter .grow .sdot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 2px; }
  #gutter .grow .count { margin-left: auto; color: var(--muted); font-size: 10px; }
  #gutter .grow.axis { border-bottom: none; }

  canvas#plot { position: absolute; left: 190px; top: 0; z-index: 1; display: block; }
  canvas#plot { cursor: grab; }
  #tooltip {
    position: absolute; z-index: 30; display: none; pointer-events: none;
    background: var(--panel); border: 1px solid var(--ochre); color: var(--cream);
    padding: 3px 7px; font-size: 11px; border-radius: 3px; white-space: nowrap;
  }

  /* ---------- details panel ---------- */
  #details {
    flex: 0 0 300px; border-left: 1px solid var(--border); background: var(--panel);
    display: flex; flex-direction: column; min-height: 0;
  }
  #details.collapsed { flex-basis: 26px; }
  #details-head {
    display: flex; align-items: center; gap: 6px; padding: 4px 8px;
    border-bottom: 1px solid var(--border); cursor: pointer; flex: 0 0 auto;
    text-transform: uppercase; letter-spacing: .12em; font-size: 11px; color: var(--ochre);
  }
  #details-body { flex: 1 1 auto; overflow-y: auto; padding: 8px; }
  #details-body h3 { margin: 10px 0 3px; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  #details-body h3:first-child { margin-top: 0; }
  #details-body .kv { display: grid; grid-template-columns: 84px 1fr; gap: 2px 8px; font-size: 11px; }
  #details-body .kv .k { color: var(--muted); }
  #details-body pre {
    margin: 0; padding: 6px; background: var(--panel2); border: 1px solid var(--border);
    border-radius: 3px; font-size: 10.5px; line-height: 1.45; overflow-x: auto;
    white-space: pre-wrap; word-break: break-all; color: var(--sand); max-height: 220px; overflow-y: auto;
  }
  #details-body pre.payload { color: var(--cream); }
  .sev { padding: 0 6px; border-radius: 3px; font-size: 10px; text-transform: uppercase; letter-spacing: .1em; }
  .sev.info { background: #1E2733; color: var(--sky); }
  .sev.warning { background: #332A1C; color: var(--amber); }
  .sev.failure { background: #331C1B; color: var(--red); }
  #details-body .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  #details-body .actions a {
    color: var(--sky); text-decoration: none; border: 1px solid var(--border);
    padding: 3px 8px; border-radius: 3px; background: var(--panel2);
  }
  #details-body .actions a:hover { border-color: var(--sky); }
  #copy-fr { position: relative; }
  #copy-fr.copied { border-color: var(--amber); color: var(--amber); }

  /* ---------- dropzone / error ---------- */
  #dropzone {
    position: absolute; inset: 0; z-index: 20; display: none;
    align-items: center; justify-content: center;
    background: rgba(11,10,18,.92); border: 2px dashed var(--ochre); margin: 10px;
    flex-direction: column; gap: 12px; text-align: center; color: var(--sand);
  }
  #dropzone.show { display: flex; }
  #error-panel {
    position: absolute; inset: 0; z-index: 25; display: none;
    align-items: center; justify-content: center; background: rgba(11,10,18,.95);
    flex-direction: column; gap: 10px; padding: 40px; text-align: center;
  }
  #error-panel.show { display: flex; }
  #error-panel .msg { color: var(--red); max-width: 640px; white-space: pre-wrap; word-break: break-all; }

  /* ---------- footer ---------- */
  #hint {
    flex: 0 0 auto; padding: 4px 10px; border-top: 1px solid var(--border);
    color: var(--muted); font-size: 11px; background: var(--panel);
  }
  #hint b { color: var(--sand); font-weight: 600; }
  #sr-live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header id="toolbar">
  <button id="zoom-out" title="zoom out (-)">−</button>
  <button id="zoom-in" title="zoom in (+)">+</button>
  <span id="zoom-pct">100%</span>
  <button id="btn-fit" title="fit full match (F)">Fit</button>
  <span class="sep"></span>
  <label class="chip" data-team="A"><input type="checkbox" id="team-A" checked><span class="dot" style="background:#D09A4E"></span><span id="team-A-label">A</span></label>
  <label class="chip" data-team="B"><input type="checkbox" id="team-B" checked><span class="dot" style="background:#7FB4C9"></span><span id="team-B-label">B</span></label>
  <label class="chip" data-team="S"><input type="checkbox" id="team-S" checked><span class="dot" style="background:#9CA6A5"></span><span>Shared</span></label>
  <span class="sep"></span>
  <button id="milestone-toggle" title="milestone-only overview">◆ Milestones</button>
  <details id="type-filter">
    <summary>types ▾</summary>
    <div id="type-list"></div>
  </details>
  <span class="sep"></span>
  <input id="search" type="text" placeholder="search id / type / payload… (Ctrl+F)" autocomplete="off">
  <span class="sep"></span>
  <button id="fail-prev" title="previous failure">◀ ⚠</button>
  <button id="fail-next" title="next failure">⚠ ▶</button>
  <span id="fail-badge">0/0</span>
  <span id="fail-status"></span>
  <span style="flex:1"></span>
  <button id="btn-load" title="load a trace.json from disk">load trace…</button>
  <button id="btn-details" title="toggle details panel">details</button>
  <input type="file" id="file-input" accept=".json,application/json" hidden>
</header>

<div id="banners"></div>

<div id="layout">
  <div id="plot-wrap">
    <div id="gutter"></div>
    <canvas id="plot"></canvas>
    <div id="tooltip"></div>
    <div id="dropzone">
      <div style="font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--ochre)">drop trace.json here</div>
      <div class="dim">or <button id="dz-browse">browse…</button></div>
    </div>
    <div id="error-panel">
      <div style="font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--red)">could not load trace</div>
      <div class="msg" id="error-msg"></div>
      <button id="err-browse">load another file…</button>
    </div>
  </div>
  <aside id="details" hidden>
    <div id="details-head"><span id="details-chev">▸</span><span id="details-title">event details</span></div>
    <div id="details-body"></div>
  </aside>
</div>

<footer id="hint">
  <b>wheel</b> zoom · <b>shift+wheel / drag</b> pan · <b>← →</b> pan · <b>↑ ↓</b> scroll tracks · <b>+ / −</b> zoom · <b>F</b> fit · <b>Esc</b> clear · <b>Ctrl+F</b> search · drop <b>trace.json</b> to load
</footer>
<div id="sr-live" aria-live="polite"></div>

<script>
/* Embedded trace data. The CLI / FTR-SWEEP worker replaces the placeholder
   (comment + null on the next line) with JSON.parse-ready JSON text. */
window.__FORGE_TRACE_DATA__=/*__FORGE_TRACE_DATA__*/null;
/* Optional review deck base URL injected by the CLI (--review-base-url):
   the placeholder on the next line is replaced with a JSON string when set. */
window.__FORGE_REVIEW_BASE_URL__=/*__FORGE_REVIEW_BASE_URL__*/undefined;

(function () {
'use strict';

/* ---------- frozen event taxonomy (mirrors src/pacing-contract.ts) ---------- */
const FORGE_EVENT_TYPES = [
  'match-start','application-transition','command-issue','order-change',
  'resource-sample','population-sample','worker-assignment-change','placement-attempt',
  'construction-start','construction-complete','training-attempt','training-start',
  'unit-completion','path-commit-attempt','path-channel-start','technology-path-lock',
  'entity-discovery','landmark-discovery','scout-loss','scout-replacement-start',
  'scout-replacement-complete','lumen-capture-start','lumen-contested','lumen-owner-change',
  'lumen-income','lumen-vision-pulse','combat-engagement','core-damage','unit-death',
  'core-destruction','winner','match-terminal','fault-injection',
];
const CHECKPOINT_EVENT_TYPES = [
  'resource-sample','match-start','construction-complete','technology-path-lock',
  'unit-completion','landmark-discovery','lumen-owner-change','core-destruction',
  'winner','match-terminal','fault-injection',
];
/* milestone-only subset (checkpoint-class + interesting moments) */
const MILESTONE_TYPES = new Set([
  'match-start','construction-complete','technology-path-lock','unit-completion',
  'landmark-discovery','lumen-capture-start','lumen-owner-change','lumen-contested',
  'core-destruction','winner','match-terminal','fault-injection','path-commit-attempt',
  'path-channel-start','unit-death','combat-engagement','core-damage','scout-loss',
]);

const TICK_HZ = 20;
const PALETTE = {
  A:   { main:'#D09A4E', ore:'#D09A4E', gas:'#E0A95C', energy:'#EDD28F', line:'#D09A4E', dim:'#7A5A2E' },
  B:   { main:'#7FB4C9', ore:'#7FB4C9', gas:'#9CC9DB', energy:'#B8DCE8', line:'#7FB4C9', dim:'#4A6E7C' },
  S:   { main:'#9CA6A5', line:'#9CA6A5', dim:'#5A6161' },
  red: '#B84B45', amber:'#EAB54C', warn:'#E0A95C', core:'#C96A5B',
  grid:'#241F33', gridMinor:'#1B1729', bandAlt:'#120F1C', band:'#0B0A12',
  unknown:'#8B7FA8', halo:'#EAB54C', lumen:'#EAB54C',
};

/* ---------- track layout spec ---------- */
const BLOCK_ORDER = ['economy','military','field'];
function trackSpecs(team) {
  const t = team;
  return [
    { team:t, block:'economy', key:t+'.res',    label:'Ore / Volatiles / Charge', types:['resource-sample'], series:['ore','gas','energy'] },
    { team:t, block:'economy', key:t+'.pop',    label:'Population / Capacity',    types:['population-sample'], series:['pop','cap'] },
    { team:t, block:'economy', key:t+'.work',   label:'Worker Assignments',       types:['worker-assignment-change'], series:['count'] },
    { team:t, block:'military', key:t+'.const', label:'Construction',             types:['construction-start','construction-complete'], spans:['construction'] },
    { team:t, block:'military', key:t+'.prod',  label:'Production Queue',         types:['training-start','unit-completion'], spans:['production'] },
    { team:t, block:'military', key:t+'.tech',  label:'Tech Path',                types:['path-commit-attempt','path-channel-start','technology-path-lock'] },
    { team:t, block:'military', key:t+'.cmd',   label:'Commands / Orders',        types:['command-issue','order-change','placement-attempt','training-attempt','application-transition'] },
    { team:t, block:'military', key:t+'.combat',label:'Combat Engagements',       types:['combat-engagement'], spans:['combat'] },
    { team:t, block:'military', key:t+'.deaths',label:'Unit Deaths',              types:['unit-death'] },
    { team:t, block:'field', key:t+'.disc',   label:'Discovery',                  types:['entity-discovery','landmark-discovery'] },
    { team:t, block:'field', key:t+'.scout',  label:'Scout Loss / Replacement',   types:['scout-loss','scout-replacement-start','scout-replacement-complete'] },
  ];
}
const SHARED_SPECS = [
  { team:'S', block:'shared', key:'S.lumen',    label:'Lumen Field',          types:['lumen-capture-start','lumen-contested','lumen-owner-change','lumen-income','lumen-vision-pulse'] },
  { team:'S', block:'shared', key:'S.core',     label:'Core Health',          types:['core-damage'], series:['hp'] },
  { team:'S', block:'shared', key:'S.terminal', label:'Terminal',             types:['winner','match-terminal','core-destruction'] },
  { team:'S', block:'shared', key:'S.unknown',  label:'Unknown',              types:['__unknown__'] },
];

const ROW_H = 22, TEAM_H = 24, BLOCK_H = 18, STRIP_H = 14, AXIS_H = 28, GUTTER_W = 190;

/* ---------- DOM refs ---------- */
const $ = (id) => document.getElementById(id);
const plotWrap = $('plot-wrap'), canvas = $('plot'), ctx = canvas.getContext('2d');
const gutter = $('gutter'), tooltip = $('tooltip'), banners = $('banners');
const detailsEl = $('details'), detailsBody = $('details-body'), detailsHead = $('details-head');
const zoomPctEl = $('zoom-pct'), failBadge = $('fail-badge'), failStatus = $('fail-status');
const searchEl = $('search'), srLive = $('sr-live');
const dropzone = $('dropzone'), errorPanel = $('error-panel'), errorMsg = $('error-msg');

/* ---------- state ---------- */
const state = {
  data: null, events: [], searchText: [],
  rows: [], tracks: new Map(), // key -> track object
  viewLeftTick: 0, pxPerSec: 1, fitPxPerSec: 1, extent: 1,
  selected: null,
  filters: { types: new Set(FORGE_EVENT_TYPES), teams: { A:true, B:true, S:true }, milestoneOnly:false },
  search: { q:'', hits:[], hitIdx:-1 },
  failures: [], failIdx: -1,
  collapsed: new Set(),
  knownTypes: new Set(FORGE_EVENT_TYPES),
  unknownTypes: new Map(), // type -> count
  cssW: 0, cssH: 0, dpr: 1,
  raf: 0, dirty: false,
  densityCol: null, densityTrack: null,
};
const fillPts = []; // scratch for series fill paths (no per-frame alloc)

/* ---------- helpers ---------- */
function fmtTime(seconds) {
  if (!Number.isFinite(seconds)) return '—';
  const s = Math.max(0, seconds);
  const m = Math.floor(s / 60), r = s - m * 60;
  const d = Math.floor((r % 1) * 10);
  const ss = String(Math.floor(r)).padStart(2, '0');
  return m + ':' + ss + '.' + d;
}
function fmtTick(tick) { return fmtTime(tick / TICK_HZ); }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function lowerBound(arr, tick) { // first index with events[idx].tick >= tick
  let lo = 0, hi = arr.length;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (arr[mid].tick < tick) lo = mid + 1; else hi = mid; }
  return lo;
}
function num(v) { return (typeof v === 'number' && Number.isFinite(v)) ? v : NaN; }
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function teamOf(evt) {
  const d = state.data; if (!d) return 'S';
  if (evt.team === d.playerFaction) return 'A';
  if (evt.team === d.rivalFaction) return 'B';
  return 'S';
}
function passesFiltersUnk(evt) {
  const f = state.filters;
  if (!f.teams[teamOf(evt)]) return false;
  if (f.milestoneOnly) return MILESTONE_TYPES.has(evt.type);
  if (!state.knownTypes.has(evt.type)) return f.types.has('__unknown__');
  if (!f.types.has(evt.type)) return false;
  const s = state.search;
  if (s.q) return !!(s.match && s.match.has(evt));
  return true;
}
/* Per-track visibility bitmasks, rebuilt only when filters/search change. */
function refreshVisibility() {
  for (const trk of state.tracks.values()) {
    const evts = trk.evts;
    if (!trk.vis || trk.vis.length !== evts.length) trk.vis = new Uint8Array(evts.length);
    for (let i = 0; i < evts.length; i++) trk.vis[i] = passesFiltersUnk(evts[i]) ? 1 : 0;
  }
}

/* ---------- indexing ---------- */
function buildIndexes() {
  const d = state.data;
  state.events = Array.isArray(d.events) ? d.events : [];
  state.events.sort((a, b) => (a.tick - b.tick) || (a.seq - b.seq));
  state.extent = (d.terminalResult && Number.isFinite(d.terminalResult.tick) && d.terminalResult.tick > 0)
    ? d.terminalResult.tick : (state.events.length ? state.events[state.events.length - 1].tick : 1);
  if (!(state.extent > 0)) state.extent = 1;

  state.knownTypes = new Set(FORGE_EVENT_TYPES);
  state.unknownTypes = new Map();
  state.searchText = new Array(state.events.length);
  state.failures = [];

  const perTrack = new Map();
  for (const spec of allSpecs()) perTrack.set(spec.key, []);
  const unkList = [];

  for (let i = 0; i < state.events.length; i++) {
    const evt = state.events[i];
    if (!evt || typeof evt !== 'object') continue;
    if (typeof evt.tick !== 'number' || !Number.isFinite(evt.tick)) evt.tick = 0;
    if (!evt.type) evt.type = '__unknown__';
    if (!state.knownTypes.has(evt.type)) {
      state.unknownTypes.set(evt.type, (state.unknownTypes.get(evt.type) || 0) + 1);
      unkList.push(evt);
    }
    const trk = trackKeyFor(evt);
    if (trk && perTrack.has(trk)) perTrack.get(trk).push(evt);
    if (evt.severity === 'failure') state.failures.push(evt);
    const pl = evt.payload && typeof evt.payload === 'object'
      ? JSON.stringify(evt.payload) : String(evt.payload ?? '');
    const ids = Array.isArray(evt.entityIds) ? evt.entityIds.join(',') : '';
    state.searchText[i] = ((evt.eventId ?? '') + '|' + evt.type + '|' + (evt.team ?? '') + '|' + ids + '|' + pl).toLowerCase();
  }

  state.tracks.clear();
  for (const spec of allSpecs()) {
    const evts = spec.key === 'S.unknown' ? unkList : perTrack.get(spec.key) || [];
    const trk = {
      spec, evts, spans: buildSpans(spec, evts),
      densityCounts: null, densityFirst: null, densityFlags: null,
      series: buildSeries(spec, evts),
    };
    state.tracks.set(spec.key, trk);
  }
  state.failures.sort((a, b) => (a.tick - b.tick) || (a.seq - b.seq));
  state.failIdx = -1;
  refreshVisibility();
}
function allSpecs() {
  const d = state.data;
  const specs = [];
  if (d) {
    for (const team of ['A', 'B']) for (const s of trackSpecs(team)) specs.push(s);
    for (const s of SHARED_SPECS) specs.push(s);
  }
  return specs;
}
function trackKeyFor(evt) {
  if (!state.knownTypes.has(evt.type)) return 'S.unknown';
  const team = teamOf(evt);
  for (const s of trackSpecs(team)) if (s.types.includes(evt.type)) return s.key;
  for (const s of SHARED_SPECS) if (s.types.includes(evt.type) && s.key !== 'S.unknown') return s.key;
  return 'S.unknown';
}
function buildSeries(spec, evts) {
  const t = spec.team;

  /* density mode: >8 marks per pixel column */
  if (densityCounts && maxCol > 8) {
    ctx.fillStyle = cols.main;
    ctx.globalAlpha = 0.75;
    ctx.beginPath();
    for (let cx = 0; cx < w; cx++) {

      ctx.rect(cx, midY - bh + 2, 1, bh);
    }

    ctx.globalAlpha = 1;
    return count;
  }

  /* normal glyphs */
  ctx.lineWidth = 1;
  for (let i = lo; i < evts.length && evts[i].tick <= viewR; i++) {
    if (vis && !vis[i]) continue;
    const evt = evts[i];

/* ---------- hit testing ---------- */
function hitTest(cx, cy) {
  const rows = state.rows;
  let row = null;
  for (const r of rows) if (r.kind === 'track' && cy >= r.y && cy < r.y + r.h) { row = r; break; }
  if (!row) return null;
  const trk = state.tracks.get(row.id);
  if (!trk) return null;
  const t = tickOf(cx);
  const tolTicks = 6 / state.pxPerSec * TICK_HZ;
  const evts = trk.evts;
  const vis = trk.vis;
  const lo = lowerBound(evts, t - tolTicks);
  let best = null, bestD = Infinity;
  for (let i = lo; i < evts.length && evts[i].tick <= t + tolTicks; i++) {
    const evt = evts[i];
    if (vis && !vis[i]) continue;
    const d = Math.abs(xOf(evt.tick) - cx);
    if (d < bestD) { bestD = d; best = evt; }
  }
  if (best) return best;
  /* density column fallback */
  const col = Math.floor(cx);
  if (trk.densityFlags && col >= 0 && col < trk.densityCounts.length && trk.densityCounts[col] > 8) {
    return evts[trk.densityFirst[col]];
  }
  return null;
}

/* ---------- failure navigation ---------- */
function updateFailStatus() {

  failBadge.textContent = (state.failIdx >= 0 && state.failIdx < n ? state.failIdx + 1 : 0) + '/' + n;
  if (state.failIdx >= 0 && state.failIdx < n) {
    const f = state.failures[state.failIdx];
    failStatus.textContent = 'Failure ' + (state.failIdx + 1) + '/' + n + ' — tick ' + f.tick + ' (' + fmtTick(f.tick) + ')';

  selectEvent(state.failures[state.failIdx], { center: true });

/* ---------- search ---------- */
function runSearch(q, advance) {
  q = (q || '').trim().toLowerCase();
  if (!q) {
    state.search = { q: '', hits: [], hitIdx: -1, match: null };
    searchEl.classList.remove('active');
    refreshVisibility();
    scheduleDraw();
    return { query: '', hits: 0, first: null };
  }
  const match = new Set();
  const hits = [];
  for (let i = 0; i < state.searchText.length; i++) {
    if (state.searchText[i].includes(q)) { match.add(state.events[i]); hits.push(i); }
  }
  let idx = advance ? 0 : 0;
  if (state.search.q === q && hits.length) {
    idx = advance ? (state.search.hitIdx + 1) % hits.length : state.search.hitIdx;
  }
  state.search = { q, hits, hitIdx: idx, match };
  searchEl.classList.add('active');
  refreshVisibility();
  let first = null;
  if (hits.length) {
    const evt = state.events[hits[idx]];
    selectEvent(evt, { center: true });
    first = detailsOf(evt);
    srLive.textContent = 'search: hit ' + (idx + 1) + ' of ' + hits.length;
  }
  scheduleDraw();
  return { query: q, hits: hits.length, first };
}

/* ---------- data loading ---------- */
function setData(trace) {
  state.data = trace;
  state.selected = null;
  state.filters.types = new Set(FORGE_EVENT_TYPES);
  state.filters.types.add('__unknown__');
  state.filters.teams = { A: true, B: true, S: true };
  state.filters.milestoneOnly = false;
  state.search = { q: '', hits: [], hitIdx: -1 };
  state.failIdx = -1;
  $('milestone-toggle').classList.remove('on');
  try {
    buildIndexes();
    buildRows();
    renderGutter();
    renderBanners();
    populateTypeList();
    updateTeamLabels();
    resizeCanvas();
    fit();
    dropzone.classList.remove('show');
    errorPanel.classList.remove('show');
    updateFailStatus();
    renderDetailsPlaceholder();
  } catch (err) {
    showError('Failed to render trace: ' + (err && err.message ? err.message : err));
  }
}

}
function showError(msg) {

}
function loadFile(file) {

    try {

      if (!trace || typeof trace !== 'object') throw new Error('trace root is not a JSON object');
      setData(trace);
    } catch (err) {

}
function tryFetchTrace() {
  if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
  const params = new URLSearchParams(location.search);
  const path = params.get('trace') || 'trace.json';
  fetch(path).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(trace => { if (trace && typeof trace === 'object' && Array.isArray(trace.events)) setData(trace); })
    .catch(() => { /* keep dropzone visible */ });
}

    },
    setZoom(scale) { setZoom(scale); return { pxPerSec: state.pxPerSec }; },
    fit() { fit(); return { pxPerSec: state.pxPerSec, viewLeftTick: state.viewLeftTick }; },
    panTo(tick) { panTo(tick); return { viewLeftTick: state.viewLeftTick }; },
    getSelectedDetails() { return state.selected ? detailsOf(state.selected) : null; },
    failureCount() { return state.failures.length; },
    search(q) { return runSearch(q, false); },
    densityInfo() {
      const out = {};
      const viewR = state.viewLeftTick + viewTicks();
      for (const [key, trk] of state.tracks) {
        const evts = trk.evts;
        const lo = lowerBound(evts, state.viewLeftTick);
        let n = 0;
        for (let i = lo; i < evts.length && evts[i].tick <= viewR; i++) {
          if (trk.vis && !trk.vis[i]) continue;
          n++;
        }
        out[key] = n / Math.max(1, state.cssW);
      }
      return out;
    },
    lastDrawMs() { return state.lastDrawMs || 0; },
    getState() {
      return {
        eventCount: state.events.length,
        viewLeftTick: state.viewLeftTick,
        pxPerSec: state.pxPerSec,
        extent: state.extent,
        teams: { ...state.filters.teams },
        selected: state.selected ? detailsOf(state.selected) : null,
        failures: state.failures.length,
      };
    },
  };
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

})();
</script>
