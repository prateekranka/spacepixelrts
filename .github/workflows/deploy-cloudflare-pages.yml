name: Deploy Cloudflare Pages Production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy Starhaven production
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Add CLOUDFLARE_API_TOKEN to the production environment or repository Actions secrets"; exit 2; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Add CLOUDFLARE_ACCOUNT_ID to the production environment or repository Actions secrets"; exit 2; }

      - name: Deploy to Cloudflare Pages production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=spacepixelrts --branch=main --commit-hash=${{ github.sha }} --commit-message="Starhaven approved animated pixel front end"

  verify:
    name: Verify production menu and loading screens
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for Cloudflare propagation
        run: |
          for attempt in $(seq 1 24); do
            if curl -fsS https://spacepixelrts.pages.dev/approved-front-art.css | grep -q 'front-approved-art-ready'; then
              echo "Approved front end is live"
              exit 0
            fi
            sleep 10
          done
          echo "Approved front end did not propagate"
          exit 1

      - name: Run live Full-HD front-end matrix
        run: npm run qa:front-end-themes -- --url=https://spacepixelrts.pages.dev --out=/tmp/starhaven-approved-production

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starhaven-approved-production
          path: /tmp/starhaven-approved-production
          if-no-files-found: warn
          retention-days: 14
