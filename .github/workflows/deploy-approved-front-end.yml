name: Deploy Approved Front End

on:
  push:
    branches: [chatgpt/deploy-approved-front-end]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy approved art to Cloudflare Pages
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - name: Check out approved production tree
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Validate production credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Cloudflare API token is unavailable in the production environment"; exit 2; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Cloudflare account ID is unavailable in the production environment"; exit 2; }

      - name: Deploy to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=spacepixelrts --branch=main --commit-hash=${{ github.sha }} --commit-message="Approved animated Starhaven pixel front end"

  verify:
    name: Verify deployed approved art
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out approved production tree
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for approved art to propagate
        run: |
          for attempt in $(seq 1 24); do
            if curl -fsS https://spacepixelrts.pages.dev/approved-front-art.css | grep -q 'front-approved-art-ready'; then
              echo "Approved front end is live"
              exit 0
            fi
            sleep 10
          done
          echo "Approved art did not propagate"
          exit 1

      - name: Run live Full-HD front-end matrix
        run: npm run qa:front-end-themes -- --url=https://spacepixelrts.pages.dev --out=/tmp/starhaven-approved-production

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starhaven-approved-production
          path: /tmp/starhaven-approved-production
          if-no-files-found: warn
          retention-days: 14
