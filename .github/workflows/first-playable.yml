name: First Playable Gate

on:
  push:
    branches: [chatgptpro2008]
  pull_request:
    branches: [main, chatgptpro2008]
  workflow_dispatch:

concurrency:
  group: first-playable-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-terminal-replay-fix:
    name: Apply diagnosed terminal replay fix
    if: github.event_name == 'pull_request' && github.head_ref == 'chatgpt/first-playable-browser-gate'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Patch stale replay terminal copy
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> bool:
              file = Path(path)
              text = file.read_text()
              if new in text:
                  return False
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one patch target, found {text.count(old)}')
              file.write_text(text.replace(old, new))
              return True

          changed = False
          changed |= replace_once(
              'src/hud.ts',
              "    this.matchEndEl.hidden = !isTerminal;\n    this.resultsEl.hidden = state !== 'Results';",
              "    this.matchEndEl.hidden = !isTerminal;\n    if (isTerminal) this.drawMatchEnd();\n    this.resultsEl.hidden = state !== 'Results';",
          )
          changed |= replace_once(
              'scripts/qa-vs3-results.mjs',
              "    assertThat(defeatTerminal.title === 'DEFEAT' && defeatTerminal.sub === 'Your Nexus is ash' && !defeatTerminal.hidden, 'Defeat terminal copy/surface is wrong');\n    await page.screenshot({ path: path.join(out, 'defeat-terminal.png'), fullPage: true });",
              "    await page.screenshot({ path: path.join(out, 'defeat-terminal.png'), fullPage: true });\n    assertThat(\n      defeatTerminal.title === 'DEFEAT' && defeatTerminal.sub === 'Your Nexus is ash' && !defeatTerminal.hidden,\n      `Defeat terminal copy/surface is wrong (${JSON.stringify(defeatTerminal)})`,\n    );",
          )
          print(f'patched={changed}')
          PY

          if git diff --quiet; then
            echo "Terminal replay fix already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hud.ts scripts/qa-vs3-results.mjs
          git commit -m "fix: refresh terminal overlay between matches"
          git push origin "HEAD:${HEAD_BRANCH}"

  deterministic-slice:
    name: Deterministic slice and production build
    needs: apply-terminal-replay-fix
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run application-flow and opening gates
        run: |
          npm run test:m0
          npm run test:m2
          npm run test:m2-ai

      - name: Run economy, technology, and army gates
        run: |
          npm run test:m3
          npm run test:m4
          npm run test:m5

      - name: Run vertical-slice gates
        run: |
          npm run test:vs2-ai
          npm run test:vs2b
          npm run test:vs3
          npm run test:vs4
          npm run test:vs5

      - name: Build deployable desktop route
        run: npm run build

  browser-slice:
    name: Browser progression and results
    needs: deterministic-slice
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser runtime
        run: npx playwright install --with-deps chromium

      - name: Run browser slice gates
        run: |
          set +e
          npm run qa:progression-handoff -- --out=/tmp/starhaven-progression
          progression_status=$?
          npm run qa:vs3 -- --out=/tmp/starhaven-results
          results_status=$?
          if [ "$progression_status" -ne 0 ] || [ "$results_status" -ne 0 ]; then
            exit 1
          fi

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-playable-browser-evidence
          path: |
            /tmp/starhaven-progression
            /tmp/starhaven-results
          if-no-files-found: warn
          retention-days: 14
