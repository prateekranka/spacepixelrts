<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Starhaven</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/front-end-scene.css" />
    <link rel="stylesheet" href="/front-end-shell.css" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #07060f;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #app {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }
      #app canvas#game,
      #app canvas#overlay {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
      }
      #app canvas#overlay {
        pointer-events: none;
        z-index: 2;
      }
      #app canvas#game {
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <style id="desktop-override">#rotate-gate{display:none !important}#app,#hud{visibility:visible !important}html,body{width:100vw;height:100vh;overflow:hidden}</style>
    <div id="app"></div>
    <div id="rotate-gate" role="status" aria-live="polite" aria-labelledby="rotate-gate-title">
      <div class="rotate-gate-card">
        <span class="rotate-gate-motif" aria-hidden="true"><span></span></span>
        <p class="rotate-gate-kicker">ORIENTATION GATE // STARHAVEN</p>
        <h1 id="rotate-gate-title">LANDSCAPE COMMAND REQUIRED</h1>
        <p class="rotate-gate-copy">Rotate the iPad to landscape to command Starhaven.</p>
        <p class="rotate-gate-note">LANDSCAPE LEFT / LANDSCAPE RIGHT READY</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
