<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Starhold</title>
    <style>
      :root {
        --ink: #0c0816;
        --panel: #14101c;
        --line: #3a3040;
        --gold: #ffd36a;
        --bone: #fff1d2;
        --muted: #c9d4e8;
        --ore: #f0d678;
        --vol: #bae6ff;
        --chg: #ffecaa;
        --hp: #6cff8a;
        --danger: #ff4a4a;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--ink);
        color: var(--bone);
        font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #view {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #hud {
        position: absolute;
        inset: 0;
        pointer-events: none;
        letter-spacing: 0.04em;
      }
      #hud * {
        pointer-events: auto;
      }
      .strip {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 40px;
        padding: 0 14px;
        display: flex;
        align-items: center;
        gap: 22px;
        background: linear-gradient(180deg, #120e18ee, #120e18aa 70%, transparent);
        font-size: 13px;
      }
      .brand {
        color: var(--gold);
        font-weight: 700;
        letter-spacing: 0.18em;
        font-size: 11px;
      }
      .res {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .res b {
        font-size: 16px;
        font-variant-numeric: tabular-nums;
      }
      .res.ore b {
        color: var(--ore);
      }
      .res.vol b {
        color: var(--vol);
      }
      .res.chg b {
        color: var(--chg);
      }
      .res.pop b {
        color: var(--hp);
      }
      .res span {
        color: var(--muted);
        font-size: 10px;
        text-transform: uppercase;
      }
      .cmd {
        position: absolute;
        left: 12px;
        right: 184px;
        bottom: 12px;
        height: 88px;
        display: flex;
        gap: 10px;
        padding: 8px;
        background: #100c16f0;
        border: 1px solid var(--line);
        box-shadow: 0 0 0 1px #000 inset;
      }
      .portrait {
        width: 72px;
        height: 72px;
        background: #1c1628;
        border: 1px solid var(--gold);
        display: grid;
        place-items: center;
        color: var(--gold);
        font-size: 10px;
        text-align: center;
        line-height: 1.3;
      }
      .verbs {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 6px;
        flex: 1;
      }
      .verb {
        background: #1a1422;
        border: 1px solid #2a2238;
        color: var(--bone);
        font: inherit;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        min-height: 44px;
      }
      .verb:active {
        border-color: var(--gold);
        color: var(--gold);
      }
      #mini {
        position: absolute;
        right: 12px;
        bottom: 12px;
        width: 160px;
        height: 160px;
        background: #05040a;
        border: 1px solid var(--line);
        image-rendering: pixelated;
      }
      .hint {
        position: absolute;
        left: 14px;
        top: 48px;
        color: var(--muted);
        font-size: 11px;
        pointer-events: none;
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud">
      <div class="strip">
        <div class="brand">STARHOLD</div>
        <div class="res ore"><span>Ore</span><b id="ore">220</b></div>
        <div class="res vol"><span>Vol</span><b id="vol">40</b></div>
        <div class="res chg"><span>Chg</span><b id="chg">90</b></div>
        <div class="res pop"><span>Pop</span><b id="pop">12/15</b></div>
      </div>
      <div class="hint">Drag to pan · pinch / wheel zoom · tap select · drag-box · RMB / long-press move</div>
      <div class="cmd">
        <div class="portrait" id="portrait">HELION<br />COMPACT</div>
        <div class="verbs">
          <button class="verb" type="button">Move</button>
          <button class="verb" type="button">Attack</button>
          <button class="verb" type="button">Stop</button>
          <button class="verb" type="button">Gather</button>
          <button class="verb" type="button">Yard</button>
          <button class="verb" type="button">Epoch</button>
        </div>
      </div>
      <canvas id="mini" width="64" height="64"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
