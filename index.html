<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Starhaven</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #07060f;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #app {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }
      #app canvas#game,
      #app canvas#overlay {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
      }
      #app canvas#overlay {
        pointer-events: none;
        z-index: 2;
      }
      #app canvas#game {
        z-index: 1;
      }
      #rotate-gate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 50;
        align-items: center;
        justify-content: center;
        background: #07060f;
        color: #f4efe4;
        font: 18px/1.4 "Trebuchet MS", "Segoe UI", sans-serif;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        text-align: center;
        padding: 32px;
      }
      @media (orientation: portrait) {
        #rotate-gate {
          display: flex;
        }
        #app,
        #hud {
          visibility: hidden;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="rotate-gate">Rotate the iPad to landscape to command Starhaven</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
